<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Петелька</title>
<meta name="theme-color" content="#F6E3E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Петелька">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/img/bg_pastel.webp" as="image">
<style>
  @font-face { font-family: 'Marck Script'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/MarckScript-cyr.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Marck Script'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/MarckScript-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 600 800; font-display: swap; src: url(assets/fonts/Nunito-cyr.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 600 800; font-display: swap; src: url(assets/fonts/Nunito-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6E3E6; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
  #safe { position: fixed; visibility: hidden; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  /* прогрев шрифтов */
  .warm { position: fixed; left: -999px; font: 400 10px 'Marck Script'; } .warm b { font: 700 10px Nunito; }
</style>
</head>
<body>
<div id="safe"></div>
<div class="warm">Петелька <b>Ряд готов</b></div>
<canvas id="bg"></canvas>
<canvas id="game"></canvas>
<script src="data/levels.js"></script>
<script src="src/util.js"></script>
<script src="src/palette.js"></script>
<script src="src/stitch.js"></script>
<script src="src/scene.js"></script>
<script src="src/audio.js"></script>
<script src="src/logic.js"></script>
<script src="src/game.js"></script>
</body>
</html>
